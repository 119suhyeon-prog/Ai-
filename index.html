function answerQuiz(answer){let q=state.quiz;if(!q||q.answers.length>q.index)return;if(!answer.trim()){toast('답을 입력하세요.');return;}let w=BYID[q.ids[q.index]],target=q.type==='en-ko'?w.ko:w.en,correct=normalize(answer)===normalize(target);q.answers.push({id:w.id,answer,correct});rate(w.id,correct?'known':'unknown','quiz',q.review);save();quiz();}
function quizResult(){let q=state.quiz,wrong=q.answers.filter(a=>!a.correct),right=q.answers.length-wrong.length;$('main').innerHTML=`<div class="study">${heading('테스트 완료','결과와 틀린 단어를 확인하세요.')}<div class="stats" style="grid-template-columns:repeat(4,1fr)">${statBox('총 문제',q.ids.length)}${statBox('정답',right,'green')}${statBox('오답',wrong.length,'red')}${statBox('정답률',Math.round(right/q.ids.length*100))}</div><section class="panel"><h2>틀린 단어 ${wrong.length}개</h2>${wrong.length?`<div class="table-wrap"><table><thead><tr><th>영어</th><th>정답 뜻</th><th>내 답</th></tr></thead><tbody>${wrong.map(a=>{let w=BYID[a.id];return `<tr><td class="en">${esc(w.en)}<br><small class="muted">${source(w)}</small></td><td>${esc(w.ko)}</td><td class="red">${esc(a.answer)}</td></tr>`;}).join('')}</tbody></table></div>`:'<p class="green">모든 문제를 맞혔습니다.</p>'}<div class="row footer-actions">${wrong.length?'<button class="primary" id="retryWrong">틀린 문제 다시 풀기</button>':''}<button id="newQuiz">새 테스트</button><button id="quizHome">대시보드</button></div></section></div>`;if($('retryWrong'))$('retryWrong').onclick=()=>{state.quiz={ids:wrong.map(a=>a.id),index:0,type:q.type,answers:[],choices:[],review:true};save();quiz();};$('newQuiz').onclick=()=>{state.quiz=null;save();quiz();};$('quizHome').onclick=()=>nav('dashboard');}

 $('dictSearch').oninput=()=>{let pos=$('dictSearch').selectionStart;f.q=$('dictSearch').value;dictPage=0;dictionary();$('dictSearch').focus();try{$('dictSearch').setSelectionRange(pos,pos);}catch(e){}};for(let [id,key]of [['dictVol','vol'],['dictTest','test'],['dictStatus','status']])$(id).onchange=()=>{f[key]=$(id).value;dictPage=0;dictionary();};$('dictGroup').onchange=()=>{f.group=$('dictGroup').checked;dictPage=0;dictionary();};$('dictPrev').onclick=()=>{dictPage--;dictionary();};$('dictNext').onclick=()=>{dictPage++;dictionary();};document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>detail(b.dataset.detail));document.querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{let r=ensure(b.dataset.star);r.star=!r.star;save();dictionary();});}

function personalList(){return personalWords.filter(w=>(personalKind==='all'||w.kind===personalKind)&&(personalFilter==='all'||personalFilter==='star'&&w.star||personalFilter==='review'&&['unknown','unsure'].includes(w.status)||w.status===personalFilter)&&(!personalQuery||normalize(w.en+' '+w.ko+' '+w.note).includes(normalize(personalQuery))));}
function personalPage(){
 const list=personalList();$('main').innerHTML=heading('내 단어장','공부하다 만난 단어·표현·문법을 모으세요. ETS 원본 1,600항목과 별도로 관리합니다.')+`<div class="notice">추가한 내용과 암기 상태는 현재 브라우저에 저장됩니다. 다른 기기로 옮길 때는 아래 내보내기·가져오기를 사용하세요. 자동 동기화는 지원하지 않습니다.</div>${personalError?'<p role="alert" class="red">기존 내 단어장을 읽거나 저장하지 못했습니다. 백업이 있다면 가져오세요. 현재 보이는 목록은 저장된 내용과 다를 수 있습니다.</p>':''}<section class="panel"><div class="row between"><h2 style="margin:0">나만의 학습 모음 <span class="pill">${personalWords.length}개</span></h2><button id="personalAdd" class="primary">+ 단어·표현 추가</button></div><div class="row" style="margin:18px 0"><button id="personalExport">내 단어장 내보내기</button><button id="personalImport">내 단어장 가져오기</button><input id="personalFile" type="file" accept=".json,application/json" hidden></div><div class="filters"><input type="search" id="personalSearch" aria-label="내 단어장 검색" placeholder="영어·뜻·메모 검색" value="${esc(personalQuery)}"><select id="personalKind" aria-label="종류">${['all','단어','표현','문법'].map(k=>`<option value="${k}" ${personalKind===k?'selected':''}>${k==='all'?'모든 종류':k}</option>`).join('')}</select><select id="personalFilter" aria-label="내 단어장 학습 상태">${[['all','전체'],['star','★ 우선 암기'],['new','미학습'],['review','모름·헷갈림'],['known','알고 있음']].map(([v,l])=>`<option value="${v}" ${personalFilter===v?'selected':''}>${l}</option>`).join('')}</select><select id="personalDirection" aria-label="내 카드 방향"><option value="en">영어 → 한국어</option><option value="ko">한국어 → 영어</option></select></div><div class="row between" style="margin-top:18px"><span class="muted">선택된 ${list.length}개 · ★ 초기 핵심 표현 15개</span><button id="personalStudy" class="primary" ${!list.length?'disabled':''}>선택 범위 카드 학습 →</button></div><div class="table-wrap"><table><thead><tr><th>단어·표현</th><th>뜻 / 메모</th><th>상태</th><th>관리</th></tr></thead><tbody>${list.map(w=>`<tr><td><b>${esc(w.en)}</b><br><small class="muted">${w.kind}</small></td><td>${esc(w.ko)}${w.note?`<details><summary class="small">예문·문법 메모</summary><p style="white-space:pre-wrap">${esc(w.note)}</p></details>`:''}</td><td>${statusName(w.status)}</td><td><div class="row"><button data-pstar="${w.id}" aria-label="${esc(w.en)} 우선 암기" aria-pressed="${w.star}">${w.star?'★':'☆'}</button><button data-pedit="${w.id}">수정</button><button data-pdelete="${w.id}" class="red">삭제</button></div></td></tr>`).join('')||'<tr><td colspan="4">조건에 맞는 항목이 없습니다. 새 단어를 추가해 보세요.</td></tr>'}</tbody></table></div></section>`;
 $('personalAdd').onclick=()=>personalEditor();$('personalSearch').oninput=e=>{personalQuery=e.target.value;const pos=e.target.selectionStart;personalPage();$('personalSearch').focus();try{$('personalSearch').setSelectionRange(pos,pos);}catch{}};
 $('personalKind').onchange=e=>{personalKind=e.target.value;personalPage();};$('personalFilter').onchange=e=>{personalFilter=e.target.value;personalPage();};
 $('personalStudy').onclick=()=>{personalSession={ids:shuffle(list).map(w=>w.id),index:0,flipped:false,direction:$('personalDirection').value};personalCard();};
 document.querySelectorAll('[data-pstar]').forEach(b=>b.onclick=()=>{const w=personalWords.find(w=>w.id===b.dataset.pstar);w.star=!w.star;savePersonal();personalPage();});
 document.querySelectorAll('[data-pedit]').forEach(b=>b.onclick=()=>personalEditor(b.dataset.pedit));
 document.querySelectorAll('[data-pdelete]').forEach(b=>b.onclick=()=>{const w=personalWords.find(w=>w.id===b.dataset.pdelete);if(confirm(`내 단어장에서 “${w.en}” 항목을 삭제할까요?`)){personalWords=personalWords.filter(x=>x.id!==w.id);savePersonal();personalPage();}});
 $('personalExport').onclick=()=>{const blob=new Blob([JSON.stringify({app:'LeahPersonalVocabulary',version:1,words:personalWords},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`Leah_personal_vocabulary_${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);};
 $('personalImport').onclick=()=>$('personalFile').click();$('personalFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>30*1024*1024)throw Error('파일이 너무 큽니다.');const d=JSON.parse(await f.text());if(d.app!=='LeahPersonalVocabulary'||d.version!==1)throw Error('내 단어장 백업 파일을 선택하세요.');const ws=validatePersonal(d.words);if(!confirm(`백업의 ${ws.length}개 항목으로 현재 내 단어장과 암기 상태를 교체할까요? ETS 기록은 유지됩니다.`))return;personalWords=ws;const ok=savePersonal();personalPage();if(ok)toast('내 단어장을 복원했습니다.');}catch(e){toast(e.message);}};
}
function personalEditor(id){const w=personalWords.find(w=>w.id===id)||{en:'',ko:'',note:'',kind:'단어',star:false};$('detail').innerHTML=`<div class="row between"><h2>${id?'항목 수정':'단어·표현 추가'}</h2><button id="personalClose" aria-label="닫기">✕</button></div><form id="personalForm" class="stack"><label style="display:block">영어 표현 또는 문법 제목<input id="personalEn" type="text" required maxlength="300" value="${esc(w.en)}"></label><label style="display:block">뜻 / 핵심 설명<input id="personalKo" type="text" required maxlength="1000" value="${esc(w.ko)}"></label><label style="display:block">종류<select id="personalType">${['단어','표현','문법'].map(k=>`<option ${k===w.kind?'selected':''}>${k}</option>`).join('')}</select></label><label style="display:block">예문·문법·출처 메모<textarea id="personalNote" maxlength="4000" rows="5" style="display:block;width:100%;font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px">${esc(w.note)}</textarea></label><label class="check"><input id="personalPriority" type="checkbox" ${w.star?'checked':''}>★ 우선 암기</label><button class="primary" type="submit">저장</button></form>`;$('detail').showModal();$('personalClose').onclick=()=>$('detail').close();$('personalEn').focus();$('personalForm').onsubmit=e=>{e.preventDefault();const en=$('personalEn').value.trim(),ko=$('personalKo').value.trim();if(!en||!ko){toast('영어와 뜻을 모두 입력하세요.');return;}if(personalWords.some(x=>x.id!==id&&normalize(x.en)===normalize(en)&&x.kind===$('personalType').value)){toast('이미 있는 항목입니다. 검색해서 수정해 주세요.');return;}const entry={id:id||'custom-'+crypto.randomUUID(),en,ko,note:$('personalNote').value.trim(),kind:$('personalType').value,star:$('personalPriority').checked,status:id?w.status:'new'};if(id)personalWords=personalWords.map(x=>x.id===id?entry:x);else personalWords.push(entry);const ok=savePersonal();$('detail').close();personalPage();if(ok)toast('내 단어장에 저장했습니다.');};}
function personalCard(){const s=personalSession;if(!s||s.index>=s.ids.length){$('main').innerHTML=heading('내 단어장 복습 완료','표시한 암기 상태를 내 단어장에서 확인하세요.')+'<button id="personalBack" class="primary">내 단어장으로</button>';$('personalBack').onclick=personalPage;return;}const w=personalWords.find(w=>w.id===s.ids[s.index]);$('main').innerHTML=`<div class="study"><div class="row between"><span class="pill">내 단어장 · ${w.kind} · ${s.index+1}/${s.ids.length}</span><button id="personalBack">목록으로</button></div><section class="panel" style="margin-top:24px;text-align:center"><button id="personalFlip" style="width:100%;min-height:230px;white-space:normal"><span class="word">${esc(s.direction==='en'?w.en:w.ko)}</span>${s.flipped?`<div class="meaning">${esc(s.direction==='en'?w.ko:w.en)}</div>`:'<p class="muted small">탭하여 정답 확인</p>'}</button>${s.flipped&&w.note?`<p style="margin:20px 0;white-space:pre-wrap;text-align:left">${esc(w.note)}</p>`:''}${w.kind!=='문법'?'<button id="personalSpeak" style="margin-top:16px">♬ 발음</button>':''}</section><div class="ratings">${[['unknown','모름','red'],['unsure','헷갈림','orange'],['known','알고 있음','green']].map(([v,l,c])=>`<button data-prate="${v}" class="${c}" ${s.flipped?'':'disabled'}>${l}</button>`).join('')}</div><p class="muted small">모름·헷갈림으로 표시한 항목은 목록의 ‘모름·헷갈림’ 필터에서 다시 복습하세요.</p></div>`;$('personalBack').onclick=personalPage;$('personalFlip').onclick=()=>{s.flipped=!s.flipped;personalCard();};if($('personalSpeak'))$('personalSpeak').onclick=()=>speak(w.en);document.querySelectorAll('[data-prate]').forEach(b=>b.onclick=()=>{w.status=b.dataset.prate;const ok=savePersonal();s.index++;s.flipped=false;personalCard();if(!ok)toast('기기에 저장하지 못했습니다. 목록에서 내보내기를 해주세요.');});}


/* Add the evening study batch once, preserving saved entries and ratings. */
try{
 const migrationKey='leah-personal-batch-20261013-evening-v1';
 if(!personalError&&localStorage.getItem(migrationKey)!=='1'){
  const batch=PERSONAL_SEED.filter(w=>w.id.startsWith('p5-20261013-evening-'));
  const existingIds=new Set(personalWords.map(w=>w.id));
  const existingNames=new Set(personalWords.map(w=>normalize(w.en)+'|'+w.kind));
  for(const entry of batch){
   if(!existingIds.has(entry.id)&&!existingNames.has(normalize(entry.en)+'|'+entry.kind)){
    personalWords.push(structuredClone(entry));
    existingIds.add(entry.id);existingNames.add(normalize(entry.en)+'|'+entry.kind);
   }
  }
  if(savePersonal())localStorage.setItem(migrationKey,'1');
 }
}catch(e){personalError=true;}

render();
</script></body></html>
